spring.application.name=github-api-project
spring.mongodb.uri=mongodb://localhost:27017/github_api
spring.data.mongodb.auto-index-creation=true

# Enable or disable automatic GitHub scanning
github.scan.enabled=false

# Run every day at 9:00 PM Eastern Time (Second, Minute, Hour, Day Month, Weekday)
github.scan.cron=0 0 21 * * *
#github.scan.cron=0 * * * * *

# Maximum repositories for commit imports per scan
github.scan.max-commit-imports=10
#github.scan.max-commit-imports=2